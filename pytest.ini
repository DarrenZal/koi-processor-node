[pytest]
pythonpath = .
asyncio_mode = strict
addopts = -p no:deepeval

# Collect only from tests/, the only directory tests/conftest.py governs. There, tests
# take targets only from KOI_TEST_DATABASE_URL, KOI_TEST_ADMIN_DSN and KOI_TEST_API_URL
# (tests/koi_test_targets.py), skip naming whichever is unset, and the run ends before
# collection if one looks live (database personal_koi or without "test", API on 8351)
# unless KOI_TEST_ALLOW_LIVE=1. HOME and the node's state and key directories point at a
# temporary directory for the run. Tests marked `live` skip unless KOI_TEST_LLM=1.
#
# A test file outside tests/ gets none of that: run it only on purpose. A directory
# outside tests/ that needs the guard has its own conftest.py that applies it.
testpaths = tests
markers =
    integration: tests that call the API at KOI_TEST_API_URL
    core: core contract endpoint tests
    federation: KOI-net federation tests
    personal: personal-profile-only tests
    bkc: BKC-profile-only tests
    live: tests that call a live LLM API; they run only with KOI_TEST_LLM=1 and the provider's key
